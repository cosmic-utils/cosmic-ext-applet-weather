[package]
name = "cosmic-ext-applet-weather"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0"
authors = ["rwxroot <rwxroot@proton.me>"]
homepage = "https://github.com/cosmic-utils/cosmic-ext-applet-weather/"
repository = "https://github.com/cosmic-utils/cosmic-ext-applet-weather.git"

[profile.release]
lto = "fat"
opt-level = 3

[dependencies]
i18n-embed = { version = "0.16.0", default-features = false, features = [
	"rust-embed",
	"fluent-system",
	"desktop-requester",
] }
i18n-embed-fl = { version = "0.10.1", default-features = false }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
	"applet",
] }
attohttpc = { version = "0.31.0", default-features = false, features = [
	"json",
	"tls-rustls-webpki-roots",
] }
rust-embed = { version = "8.12.0", default-features = false }
serde = "1.0.229"
tracing = { version = "0.1.44", default-features = false, features = ["log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
	"ansi",
	"env-filter",
] }
